<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="display">

    <div class="container">

      <div class="star">
        <img class="star-img" src="images/icon-star.svg">
      </div>
  
        <h2>How did we do?</h2>
        <span>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</span>
  
        <div class="buttons">
          <button class="btn">1</button>
          <button class="btn">2</button>
          <button class="btn">3</button>
          <button class="btn">4</button>
          <button class="btn">5</button>
        </div>
      
        <button class="submit-btn">SUBMIT</button>
      
    </div>
  
    <div class="thanks">
      <div class="thanks-screen">

        <div>
          <img class="thanks-img" src="images/illustration-thank-you.svg">
        </div>
  
        <div class="selected">

        </div>
        
        <h2>Thank you!</h2>
        <span>We appreciate you taking the time to give a rating. If you ever need more support, don’t hesitate to get in touch!</span>

      </div>

    </div>

  </div>
  


  <script src="script.js"></script>
</body>
</html>
